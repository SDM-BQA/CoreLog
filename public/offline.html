<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101022" />
    <title>You're offline – CoreLog</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#101022;color:#fff;font-family:Inter,"Segoe UI",system-ui,sans-serif;text-align:center;
        background-image:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(59,59,255,.28),transparent 70%)}
      main{max-width:420px}
      img{width:72px;height:72px;margin-bottom:22px}
      h1{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:0 0 10px}
      p{color:#94a3b8;line-height:1.6;margin:0 0 26px}
      button{background:#3b3bff;color:#fff;border:0;border-radius:12px;padding:12px 24px;font:600 14px inherit;font-family:inherit;cursor:pointer}
      button:hover{background:#4b4bff}
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="CoreLog" />
      <h1>You're offline</h1>
      <p>CoreLog needs a connection to load your logs. Check your internet, then try again. Nothing you've saved is lost.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
